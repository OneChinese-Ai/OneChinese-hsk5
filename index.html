const mcq=[['中国市场对泰国榴莲的需求快速增加，但进口数量暂时无法满足需求。这种情况属于：',['供大于求','供不应求','库存过高','市场份额下降'],1],['某泰国椰子品牌在中国同类产品销售中所占的比例从5%增加到8%，说明：',['市场份额扩大','物流成本下降','出口量一定下降','货源减少'],0],['一家出口商通过高品质包装和稳定供货，与其他企业形成明显区别。这种策略叫作：',['价格波动','差异化','供大于求','库存管理'],1],['由于燃油价格上涨和冷藏运输费用增加，企业最可能面临：',['物流成本上升','零售价必然下降','损耗率必然为零','市场需求消失'],0],['客户询问一批泰国山竹的FOB价格，销售人员应该首先：',['直接发货','提供符合交易条件的报价','减少库存记录','停止供应'],1],['某批水果到货后，部分产品因温度控制不当而腐烂，主要涉及：',['市场份额与旺季','冷链与损耗','差异化与报价','竞争对手与零售价'],1],['某水果在中国超市售价为每公斤40元，批发商采购价为每公斤25元。40元属于：',['批发价','物流成本','零售价','货源成本'],2],['今年泰国椰子出口量增加，但中国市场需求没有同步增长，其他条件不变，价格可能：',['下跌','一定上涨','永远不变','无法受到供需影响'],0],['出口商希望减少因供应商临时缺货而导致的订单延误，应优先提高：',['供应稳定性','价格波动','零售价','市场份额统计'],0],['某企业的产品品质稳定、交货及时、售后服务完善，因此更容易获得客户订单。这说明企业具有较强的：',['库存压力','竞争力','进口量','损耗'],1]];

const caseText='【模拟商业数据】上个月泰国榴莲出口量为1200吨，本月为1500吨；中国批发价从35元/公斤降至30元/公斤；物流成本从5元/公斤升至6元/公斤。请结合这些变化阅读以下案例。\n\n某泰国水果出口企业主要向中国市场销售新鲜椰子。去年，该企业每月平均出口10个集装箱，今年计划增加到15个。但是，随着越来越多的竞争对手进入市场，中国批发商的采购价格开始下跌。同时，由于运输费用上涨，企业的物流成本增加了12%。此外，部分椰子因冷链管理不完善而出现质量问题，损耗率从3%上升到8%。企业还面临库存积压和供应商交货不稳定的问题。为了提高竞争力，管理层正在考虑改善冷链系统、加强供应商管理、优化库存，并通过品牌包装实现产品差异化。';
const cases=['根据案例，指出影响这家企业利润的至少三个因素。','如果你是出口经理，你会采取哪些措施降低风险？请提出至少三项建议。','结合上方模拟数据，说明为什么出口量增加时批发价仍可能下跌，并提出两项差异化策略。'];
const subjectiveRefs=[['在其他条件不变时，供应量增长快于市场需求，可能形成供大于求并带来价格下跌压力。提高报价是否合理，还需结合品质、季节、运输成本和客户需求判断。','建议选择A公司。相同报价下，稳定交货可以降低断货风险、减少额外物流和沟通成本，提高供应链可靠性。','不能只比较运费，应综合运输费用、损耗率、到货品质、退货赔偿和客户满意度，计算总成本；必要时采用冷链运输。'],['利润受到中国市场批发价下跌、物流成本上涨、冷链管理不完善导致损耗率提高、库存积压和供应不稳定等因素影响。','建议改善冷链管理、选择稳定货源并建立供应商考核制度、根据订单控制库存、加强质量检查并制定运输应急方案。','模拟数据中出口量从1200吨增至1500吨，但批发价从35元/公斤跌至30元/公斤，说明供应增加可能带来价格下行压力；不能仅凭出口量判断市场需求。可采用品质分级、产品溯源、差异化包装与稳定交货等策略，而非单纯降价。']];const explanations=['市场份额表示企业销售占整个市场的比例，不等于销售总量。','物流成本包含运输、仓储、配送等支出。','供应稳定性强调持续且按时供货。','价格波动表示价格随时间发生变化。','差异化强调通过产品或服务形成区别。','货源指可采购商品的来源。','库存是尚未出售或使用的存货。','冷链强调储运全过程的温度控制。','竞争力体现企业相对于同行的综合优势。','报价是卖方向买方提出的价格及相关条件。'];const mcqReasons=['需求超过现有供应量，属于供不应求。','5%提高到8%，说明品牌占市场销售的比例扩大。','包装和稳定供货形成区别，属于差异化。','燃油及冷藏运输费上升会推高物流成本，但不必然决定零售价。','客户询价时应提供与贸易条款一致的报价。','温控不当造成腐烂，涉及冷链管理与损耗。','消费者在超市支付的价格是零售价。','供给增加而需求未同步增长，可能产生价格下跌压力，并非必然。','避免断货与延期交付的核心是供应稳定性。','品质、交货和服务共同提升竞争力。'];const fillReasons=['供应增长超过需求增长，可能出现供大于求。','客户要求卖方正式提出价格，即报价。','供货不足以满足购买需求，属于供不应求。','未售商品积压会形成库存压力。','销售高峰期称为旺季。','全程温控运输对应冷链。','从国外进入中国的商品数量称进口量。','合作果园等采购来源属于货源。','价格随供需变化上下变动称价格波动。','腐烂、破损等造成的商品损失称损耗。'];const dialogueReasons=['询问近期价格与市场动态，使用市场行情。','供应增加时价格可能下跌，但不是必然。','能否持续按时供货，关注供应稳定性。','多个合作果园意味着货源较充足。','要求正式价格和交易条件，使用报价。'];const titles=['词语搭配','选择题','选词填空','情景判断','商务对话','案例分析'];const points=[15,20,20,15,15,15];const counts=[10,10,10,3,5,3];let state={name:'',answers:{},submitted:false,submittedAt:null},part=0;
try{const saved=JSON.parse(localStorage.getItem('onechinese-hsk5-v1'));if(saved&&typeof saved==='object'&&saved.answers)state=saved}catch(e){};
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem('onechinese-hsk5-v1',JSON.stringify(state))}catch(e){}};
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function addQuestion(container,n,q,key,type,options){const box=el('div',undefined,'question');box.append(el('p',n+'. '+q));if(type==='select'){let select=el('select');select.append(new Option('请选择词语',''));options.forEach(o=>select.append(new Option(o,o)));select.value=state.answers[key]||'';select.onchange=()=>{state.answers[key]=select.value;save();progress()};box.append(select)}else if(type==='radio'){options.forEach((o,i)=>{let lab=el('label',undefined,'choice'),inp=el('input');inp.type='radio';inp.name=key;inp.value=String(i);inp.checked=state.answers[key]===String(i);inp.onchange=()=>{state.answers[key]=inp.value;save();progress()};lab.append(inp,document.createTextNode('ABCD'[i]+'. '+o));box.append(lab)})}else{let inp=el(type==='textarea'?'textarea':'input');if(type!=='textarea')inp.type='text';inp.placeholder=type==='textarea'?'请结合案例说明理由':'请输入答案';inp.value=state.answers[key]||'';inp.oninput=()=>{state.answers[key]=inp.value;save();progress()};box.append(inp)}container.append(box)}
function progress(){let total=0;for(let i=0;i<6;i++)for(let j=0;j<counts[i];j++)if(String(state.answers[i+'-'+j]||'').trim())total++;$('meta').textContent='学生：'+state.name+' · 已完成 '+total+'/41 题';$('bar').style.width=(total/41*100)+'%'}
function render(){if(state.submitted){showResult();return}$('intro').classList.add('hidden');$('exam').classList.remove('hidden');$('results').classList.add('hidden');$('tabs').replaceChildren();titles.forEach((t,i)=>{let b=el('button','Part '+(i+1));b.className=i===part?'active':'secondary';b.onclick=()=>{part=i;render()};$('tabs').append(b)});$('parttitle').textContent='Part '+(part+1)+' · '+titles[part]+'（'+points[part]+'分）';$('instruction').textContent=['根据释义选择对应的词语。','选择最合适的答案。','从词语库中选择合适的词语填空，每词限用一次。','阅读商务情境并回答问题。','根据商务洽谈情境完成对话。','阅读案例并回答问题。'][part];const content=$('content');content.replaceChildren();if(part===0)match.forEach((x,i)=>addQuestion(content,i+1,x[0],'0-'+i,'select',match.map(y=>y[1])));if(part===1)mcq.forEach((x,i)=>addQuestion(content,i+1,x[0],'1-'+i,'radio',x[1]));if(part===2){let bank=el('div',undefined,'chips');fills.forEach(x=>bank.append(el('span',x[1],'chip')));content.append(bank);fills.forEach((x,i)=>addQuestion(content,i+1,x[0],'2-'+i,'text'))}if(part===3){content.append(el('p','答题句型：从供求关系来看…… / 我认为……因为…… / 一方面……另一方面……','notice'));situations.forEach((x,i)=>addQuestion(content,i+1,x[0]+'\n问题：'+x[1],'3-'+i,'textarea'))};if(part===4){let bank=el('div',undefined,'chips');['市场行情','旺季','下跌','供应稳定性','货源','报价','上涨'].forEach(x=>bank.append(el('span',x,'chip')));content.append(bank);dialogue.forEach((x,i)=>addQuestion(content,i+1,x[0]+'：'+x[1],'4-'+i,'text'))}if(part===5){content.append(el('p','答题提示：先说明数据变化，再分析原因，最后提出可执行的建议。','notice'));content.append(el('p',caseText,'notice'));cases.forEach((x,i)=>addQuestion(content,i+1,x,'5-'+i,'textarea'))}$('prev').disabled=part===0;$('next').textContent=part===5?'提交答卷':'下一部分 →';progress();window.scrollTo({top:0,behavior:'instant'})}
$('start').onclick=()=>{const name=$('student').value.trim();if(!name){alert('请填写学生姓名');return}state.name=name;save();render()};$('prev').onclick=()=>{if(part>0){part--;render()}};$('next').onclick=()=>{if(part<5){part++;render();return}const unanswered=[];for(let i=0;i<6;i++)for(let j=0;j<counts[i];j++)if(!String(state.answers[i+'-'+j]||'').trim())unanswered.push('Part '+(i+1)+' 第'+(j+1)+'题');if(unanswered.length&&!confirm('还有 '+unanswered.length+' 题未作答。确定提交吗？'))return;if(!confirm('提交后本次答卷将锁定，确定提交吗？'))return;state.submitted=true;state.submittedAt=new Date().toISOString();save();showResult()};
function score(){let s=0;match.forEach((x,i)=>{if(state.answers['0-'+i]===x[1])s+=1.5});mcq.forEach((x,i)=>{if(state.answers['1-'+i]===String(x[2]))s+=2});fills.forEach((x,i)=>{if((state.answers['2-'+i]||'').replace(/\s/g,'')===x[1])s+=2});dialogue.forEach((x,i)=>{const got=(state.answers['4-'+i]||'').replace(/[\s，,、;；]/g,'');const expected=x[2].replace(/[、，,]/g,'');if(got===expected)s+=3});return s}
function makeReport(){return {course:'OneChinese HSK5 中泰水果商务汉语',student:state.name,submittedAt:state.submittedAt,objectiveScore:score(),objectiveMaximum:70,subjectiveScore:'待教师评分（30分）',answers:titles.map((title,i)=>({part:i+1,title,items:Array.from({length:counts[i]},(_,j)=>({question:i===0?match[j][0]:i===1?mcq[j][0]:i===2?fills[j][0]:i===3?situations[j].join(' '):i===4?dialogue[j][0]+'：'+dialogue[j][1]:cases[j],answer:state.answers[i+'-'+j]||'',reference:i===0?match[j][1]:i===1?mcq[j][1][mcq[j][2]]:i===2?fills[j][1]:i===4?dialogue[j][2]:'教师人工评分'}))}))}}

 $('intro').classList.add('hidden');$('exam').classList.add('hidden');$('results').classList.remove('hidden');
